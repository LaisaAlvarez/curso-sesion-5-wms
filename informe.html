<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Informe Ejecutivo — Simulador WMS</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .informe p { max-width: 760px; line-height: 1.7; }
    .informe .destacado {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.55;
      margin: 6px 0 22px;
      padding: 16px 20px;
      max-width: 720px;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-left: 4px solid var(--series-mexico);
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    .informe ul { max-width: 760px; padding-left: 20px; }
    .informe li { margin-bottom: 6px; }
  </style>
</head>
<body>
  <div id="app-nav"></div>
  <main>
    <h1>Informe ejecutivo</h1>
    <p class="subtitle">Explicación en lenguaje llano de qué se construyó, qué se encontró, y qué se recomienda.</p>
    <div id="content" class="informe">Cargando datos…</div>
  </main>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script type="module" src="js/pages/page-informe.js"></script>
</body>
</html>
